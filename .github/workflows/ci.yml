# Same gate as CLAUDE.md: backend build + format + tests, frontend lint + format + types + tests + build,
# and the committed OpenAPI client must match the API.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - run: dotnet restore BookStore.slnx
      - run: dotnet build BookStore.slnx --no-restore -c Release
      - run: dotnet format BookStore.slnx --verify-no-changes --no-restore
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test BookStore.slnx --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # The build never calls the API (data pages render per request).
      - run: npm run build

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run gen:api
        working-directory: frontend
      - name: Typed client is up to date
        run: git diff --exit-code -- frontend/src/lib/api/ || (echo "::error::Run 'npm run gen:api' and commit the result." && exit 1)

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f backend/src/BookStore.Api/Dockerfile backend
      - run: docker build frontend

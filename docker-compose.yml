# Local development stack.
#   docker compose up -d                 -> PostgreSQL only (run the API with `dotnet run`)
#   docker compose --profile api up -d   -> PostgreSQL + the API in a container
# Values come from .env (copy .env.example). Production uses Supabase, not this file.
name: bookstore

services:
  db:
    # 17 matches Supabase. Override with POSTGRES_IMAGE in .env if needed.
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookstore}
      POSTGRES_USER: ${POSTGRES_USER:-bookstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build:
      context: ./backend
      dockerfile: src/BookStore.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-bookstore};Username=${POSTGRES_USER:-bookstore};Password=${POSTGRES_PASSWORD}"
      Cors__AllowedOrigins__0: http://localhost:3000
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      Seed__Admin__Email: ${ADMIN_EMAIL:-}
      Seed__Admin__Password: ${ADMIN_PASSWORD:-}
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "true"
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
